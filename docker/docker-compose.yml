version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: elearning_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: elearning
      MYSQL_USER: elearning
      MYSQL_PASSWORD: elearning123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../database/init.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "elearning", "-pelearning123"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - elearning_net

  backend:
    build:
      context: ../backend-dotnet
      dockerfile: Dockerfile
    container_name: elearning_backend
    restart: unless-stopped
    environment:
      ConnectionStrings__DefaultConnection: "server=mysql;port=3306;database=elearning;user=elearning;password=elearning123;CharSet=utf8mb4"
      Jwt__Secret: "jwt-secret-change-me-thirty-two-characters-long"
      Jwt__ExpiryMinutes: "1440"
      VnPay__TmnCode: ""
      VnPay__HashSecret: ""
      VnPay__Url: "https://sandbox.vnpayment.vn/paymentv2/vpcpay.html"
      VnPay__ReturnUrl: "http://localhost/api/payment/vnpay-return"
      VnPay__IpnUrl: ""
      PayPal__ClientId: "ARoevRyCbe2QsWaAiz8Ld1ZkNVCgP8Yx5LzvRwfmXZjH1uHcpFyASAiRw_aiqxley4VJWjsKG62GpLLE"
      PayPal__ClientSecret: "ENsq-AKEERyTzga8Oo5kzmPNi313YuYmml9GqrkAuxAWGUkvQcZHp_PdJmoToEZvZN1mBlNbSQc_U0T5"
      PayPal__BaseUrl: "https://api-m.sandbox.paypal.com"
      PayPal__ReturnUrl: "http://localhost/api/payment/paypal-return"
      PayPal__CancelUrl: "http://localhost/checkout/index.html"
      PayPal__VndRate: "26000.0"
      Mux__TokenId: ""
      Mux__TokenSecret: ""
      Mux__SigningKeyId: ""
      Mux__SigningPrivateKey: ""
      Gemini__ApiKey: ""
      Cors__Origins: "http://localhost,http://localhost:80,http://127.0.0.1"
      Uploads__UploadDir: "uploads"
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - elearning_net

  nginx:
    image: nginx:alpine
    container_name: elearning_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../frontend:/usr/share/nginx/html
      - ../nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - elearning_net

volumes:
  mysql_data:
  uploads_data:

networks:
  elearning_net:
    driver: bridge
